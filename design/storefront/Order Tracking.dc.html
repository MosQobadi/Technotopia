<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: white; color: oklch(0.17 0 0); font-family: 'Plus Jakarta Sans', sans-serif; }
    a { color: oklch(0.58 0.2 258); text-decoration: none; }
    a:hover { color: oklch(0.5 0.21 258); text-decoration: underline; }
  </style>
</helmet>

<header style="background: white; border-bottom: 1px solid oklch(0.94 0 0);">
  <div style="max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 12px;">
    <a href="./Home.dc.html" style="display: flex; align-items: center; gap: 7px;">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: oklch(0.58 0.2 258);"></span>
      <span style="font-weight: 800; font-size: 19px; color: oklch(0.17 0 0); letter-spacing: -0.01em;">Technotopia</span>
    </a>
  </div>
</header>

<main style="max-width: 720px; margin: 0 auto; padding: 48px 24px 96px;" data-screen-label="Order Tracking">
  <h1 style="font-size: 30px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.015em;">Track your order</h1>
  <p style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: oklch(0.5 0 0); margin: 0 0 32px;">{{ orderNumber }} · Placed {{ orderDate }}</p>

  <div style="background: oklch(0.97 0.002 240); border-radius: 20px; padding: 32px 28px; margin-bottom: 32px;">
    <div style="display: flex; align-items: flex-start;">
      <sc-for list="{{ steps }}" as="step" hint-placeholder-count="4">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; position: relative;">
          <sc-if value="{{ step.hasLine }}">
            <div style="position: absolute; top: 10px; left: 50%; width: 100%; height: 2px; background: {{ step.lineColor }};"></div>
          </sc-if>
          <div style="width: 22px; height: 22px; border-radius: 50%; background: {{ step.dotColor }}; z-index: 1; display: flex; align-items: center; justify-content: center;">
            <sc-if value="{{ step.done }}"><span style="color: white; font-size: 12px; font-weight: 800;">✓</span></sc-if>
          </div>
          <span style="font-size: 12px; font-weight: 600; color: {{ step.textColor }}; margin-top: 12px; text-align: center;">{{ step.label }}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px;">
    <sc-for list="{{ history }}" as="h" hint-placeholder-count="4">
      <div style="display: flex; gap: 14px; align-items: flex-start;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: oklch(0.58 0.2 258); margin-top: 6px; flex-shrink: 0;"></span>
        <div>
          <div style="font-size: 14px; font-weight: 600;">{{ h.label }}</div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: oklch(0.5 0 0);">{{ h.timestamp }}</div>
        </div>
      </div>
    </sc-for>
  </div>
</main>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  currentStepIndex = 2;
  stepLabels = ['Order Placed', 'Processing', 'Shipped', 'Out for Delivery', 'Delivered'];
  historyData = [
    { label: 'Package shipped from warehouse', timestamp: '2026-07-14 · 09:20' },
    { label: 'Order processed and packed', timestamp: '2026-07-13 · 16:05' },
    { label: 'Payment confirmed', timestamp: '2026-07-12 · 11:42' },
    { label: 'Order placed', timestamp: '2026-07-12 · 11:40' },
  ];
  renderVals() {
    const cur = this.currentStepIndex;
    return {
      orderNumber: '#TT-48213',
      orderDate: 'Jul 12, 2026',
      steps: this.stepLabels.map((label, i) => ({
        label,
        done: i <= cur,
        dotColor: i <= cur ? 'oklch(0.58 0.2 258)' : 'oklch(0.9 0 0)',
        textColor: i <= cur ? 'oklch(0.17 0 0)' : 'oklch(0.55 0 0)',
        hasLine: i > 0,
        lineColor: i <= cur ? 'oklch(0.58 0.2 258)' : 'oklch(0.9 0 0)',
      })),
      history: this.historyData,
    };
  }
}

</script>
</body>
</html>
