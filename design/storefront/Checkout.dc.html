<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: white; color: oklch(0.17 0 0); font-family: 'Plus Jakarta Sans', sans-serif; }
    a { color: oklch(0.58 0.2 258); text-decoration: none; }
    a:hover { color: oklch(0.5 0.21 258); text-decoration: underline; }
    ::selection { background: oklch(0.58 0.2 258 / 0.2); }
    *:focus-visible { outline: 2px solid oklch(0.58 0.2 258); outline-offset: 2px; }
    input, select { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</helmet>

<header style="background: white; border-bottom: 1px solid oklch(0.94 0 0);">
  <div style="max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 12px;">
    <a href="./Home.dc.html" style="display: flex; align-items: center; gap: 7px;">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: oklch(0.58 0.2 258);"></span>
      <span style="font-weight: 800; font-size: 19px; color: oklch(0.17 0 0); letter-spacing: -0.01em;">Technotopia</span>
    </a>
  </div>
</header>

<main style="max-width: 1000px; margin: 0 auto; padding: 40px 24px 96px;" data-screen-label="Checkout">
  <h1 style="font-size: 30px; font-weight: 800; margin: 0 0 32px; letter-spacing: -0.015em;">Checkout</h1>

  <div style="display: grid; grid-template-columns: 1fr 320px; gap: 40px; align-items: start;">
    <div style="display: flex; flex-direction: column; gap: 32px;">
      <section>
        <h2 style="font-size: 17px; font-weight: 700; margin: 0 0 16px;">Shipping address</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <input value="{{ form.fullName }}" onChange="{{ set.fullName }}" placeholder="Full name" style="grid-column: span 2; padding: 13px 16px; border-radius: 12px; border: 1px solid oklch(0.9 0 0); font-size: 14px;">
          <input value="{{ form.phone }}" onChange="{{ set.phone }}" placeholder="Phone number" style="grid-column: span 2; padding: 13px 16px; border-radius: 12px; border: 1px solid oklch(0.9 0 0); font-size: 14px;">
          <input value="{{ form.address }}" onChange="{{ set.address }}" placeholder="Street address" style="grid-column: span 2; padding: 13px 16px; border-radius: 12px; border: 1px solid oklch(0.9 0 0); font-size: 14px;">
          <input value="{{ form.city }}" onChange="{{ set.city }}" placeholder="City" style="padding: 13px 16px; border-radius: 12px; border: 1px solid oklch(0.9 0 0); font-size: 14px;">
          <input value="{{ form.postalCode }}" onChange="{{ set.postalCode }}" placeholder="Postal code" style="padding: 13px 16px; border-radius: 12px; border: 1px solid oklch(0.9 0 0); font-size: 14px;">
        </div>
      </section>

      <section>
        <h2 style="font-size: 17px; font-weight: 700; margin: 0 0 16px;">Payment method</h2>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <sc-for list="{{ paymentOptions }}" as="opt" hint-placeholder-count="2">
            <label style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 14px; background: {{ opt.bg }}; cursor: pointer;">
              <input type="radio" name="payment" checked="{{ opt.checked }}" onChange="{{ opt.onSelect }}">
              <span style="font-size: 14px; font-weight: 600;">{{ opt.label }}</span>
            </label>
          </sc-for>
        </div>
      </section>
    </div>

    <div style="background: oklch(0.97 0.002 240); border-radius: 20px; padding: 24px; position: sticky; top: 24px;">
      <h2 style="font-size: 17px; font-weight: 700; margin: 0 0 20px;">Order Summary</h2>
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="3">
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: oklch(0.4 0 0); margin-bottom: 10px;">
          <span>{{ item.name }} × {{ item.qty }}</span><span>{{ item.lineTotalLabel }}</span>
        </div>
      </sc-for>
      <div style="border-top: 1px solid oklch(0.9 0 0); margin-top: 10px; padding-top: 16px; display: flex; justify-content: space-between; font-size: 14px; color: oklch(0.45 0 0); margin-bottom: 10px;">
        <span>Subtotal</span><span>{{ subtotalLabel }}</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: oklch(0.45 0 0); margin-bottom: 16px;">
        <span>Shipping</span><span>{{ shippingLabel }}</span>
      </div>
      <div style="border-top: 1px solid oklch(0.9 0 0); padding-top: 16px; display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; margin-bottom: 24px;">
        <span>Total</span><span>{{ totalLabel }}</span>
      </div>
      <a href="./Order Confirmation.dc.html" style="display: block; text-align: center; background: oklch(0.58 0.2 258); color: white; border-radius: 999px; padding: 14px 0; font-weight: 700; font-size: 15px;" style-hover="background: oklch(0.5 0.21 258);">Place Order</a>
    </div>
  </div>
</main>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    form: { fullName: '', phone: '', address: '', city: '', postalCode: '' },
    paymentMethod: 'card',
  };
  items = [
    { name: 'Cardio X2 Condenser Mic', price: 4200000, qty: 1 },
    { name: 'Halo 60 LED Panel', price: 6800000, qty: 2 },
    { name: 'Carbon Tripod 180', price: 5900000, qty: 1 },
  ];
  formatPrice(n) { return n.toLocaleString('fa-IR') + '\uFDFC'; }
  renderVals() {
    const subtotal = this.items.reduce((sum, it) => sum + it.price * it.qty, 0);
    const shipping = 800000;
    const set = {};
    ['fullName', 'phone', 'address', 'city', 'postalCode'].forEach(k => {
      set[k] = (e) => this.setState(s => ({ form: { ...s.form, [k]: e.target.value } }));
    });
    const methods = [
      { key: 'card', label: 'Credit / debit card' },
      { key: 'bank', label: 'Bank transfer' },
    ];
    return {
      form: this.state.form,
      set,
      paymentOptions: methods.map(m => ({
        label: m.label,
        checked: this.state.paymentMethod === m.key,
        bg: this.state.paymentMethod === m.key ? 'oklch(0.58 0.2 258 / 0.08)' : 'oklch(0.97 0.002 240)',
        onSelect: () => this.setState({ paymentMethod: m.key }),
      })),
      items: this.items.map(it => ({ ...it, lineTotalLabel: this.formatPrice(it.price * it.qty) })),
      subtotalLabel: this.formatPrice(subtotal),
      shippingLabel: this.formatPrice(shipping),
      totalLabel: this.formatPrice(subtotal + shipping),
    };
  }
}

</script>
</body>
</html>
