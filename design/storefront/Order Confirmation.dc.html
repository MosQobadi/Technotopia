<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: white; color: oklch(0.17 0 0); font-family: 'Plus Jakarta Sans', sans-serif; }
    a { color: oklch(0.58 0.2 258); text-decoration: none; }
    a:hover { color: oklch(0.5 0.21 258); text-decoration: underline; }
  </style>
</helmet>

<header style="background: white; border-bottom: 1px solid oklch(0.94 0 0);">
  <div style="max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 12px;">
    <a href="./Home.dc.html" style="display: flex; align-items: center; gap: 7px;">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: oklch(0.58 0.2 258);"></span>
      <span style="font-weight: 800; font-size: 19px; color: oklch(0.17 0 0); letter-spacing: -0.01em;">Technotopia</span>
    </a>
  </div>
</header>

<main style="max-width: 640px; margin: 0 auto; padding: 96px 24px 96px; text-align: center;" data-screen-label="Order Confirmation">
  <div style="width: 64px; height: 64px; border-radius: 50%; background: oklch(0.55 0.14 148 / 0.12); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
    <span style="width: 14px; height: 14px; border-radius: 50%; background: oklch(0.55 0.14 148);"></span>
  </div>
  <h1 style="font-size: 30px; font-weight: 800; margin: 0 0 12px; letter-spacing: -0.015em;">Order confirmed</h1>
  <p style="font-size: 15px; color: oklch(0.45 0 0); line-height: 1.6; margin: 0 0 32px;">Thanks — we've received your order and will start preparing it right away. A confirmation has been sent to your account.</p>

  <div style="background: oklch(0.97 0.002 240); border-radius: 20px; padding: 28px; text-align: left; margin-bottom: 32px;">
    <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 12px;">
      <span style="color: oklch(0.5 0 0);">Order number</span><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600;">{{ orderNumber }}</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 12px;">
      <span style="color: oklch(0.5 0 0);">Estimated delivery</span><span style="font-weight: 600;">{{ estimatedDelivery }}</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 14px;">
      <span style="color: oklch(0.5 0 0);">Total paid</span><span style="font-weight: 800;">{{ totalLabel }}</span>
    </div>
  </div>

  <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
    <a href="./Order Tracking.dc.html" style="background: oklch(0.58 0.2 258); color: white; border-radius: 999px; padding: 13px 26px; font-weight: 700; font-size: 14px;">Track order</a>
    <a href="./Home.dc.html" style="background: white; color: oklch(0.17 0 0); border: 1.5px solid oklch(0.17 0 0); border-radius: 999px; padding: 12px 26px; font-weight: 700; font-size: 14px;">Continue shopping</a>
  </div>
</main>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  formatPrice(n) { return n.toLocaleString('fa-IR') + '\uFDFC'; }
  renderVals() {
    return {
      orderNumber: '#TT-48213',
      estimatedDelivery: '3–5 business days',
      totalLabel: this.formatPrice(28100000),
    };
  }
}

</script>
</body>
</html>
