user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  keepalive_timeout  65;

  # Admin image uploads are capped at 5MB by the upload route; nginx's 1MB
  # default would reject anything larger with a 413 before it got there.
  client_max_body_size 5m;

  gzip            on;
  gzip_vary       on;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

  upstream app {
    server app:3000;
  }

  # Plain HTTP: only serves the certbot ACME challenge, everything else
  # redirects to HTTPS. Replace your-domain.com with the real domain.
  server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS — uncomment once `certbot` has issued a certificate for the domain
  # (see DEPLOYMENT.md). Requires the cert volume mounted in
  # docker-compose.prod.yml at /etc/letsencrypt.
  #
  # server {
  #   listen 443 ssl;
  #   listen [::]:443 ssl;
  #   server_name your-domain.com www.your-domain.com;
  #
  #   ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #
  #   add_header X-Frame-Options "SAMEORIGIN" always;
  #   add_header X-Content-Type-Options "nosniff" always;
  #   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  #
  #   location /.well-known/acme-challenge/ {
  #     root /var/www/certbot;
  #   }
  #
  #   location / {
  #     proxy_pass http://app;
  #     proxy_http_version 1.1;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #   }
