# Production stack: app + nginx + a self-hosted Postgres container.
#
# Postgres decision (Task 25.2): self-hosted `postgres:16` in this stack on a
# named volume, not a managed database. No provider is chosen yet, so a managed
# instance would mean writing DATABASE_URL, TLS mode and the backup routine
# against a placeholder; the self-hosted container runs on any generic VPS and
# is what DEPLOYMENT.md section 7's pg_dump backup routine already assumes.
#
# Run it with the production env file as BOTH the interpolation source and the
# runtime env, or the ${...} values below silently fall back to the dev `.env`:
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Its own project name keeps this stack's containers, network and volume
# separate from the dev `docker-compose.yml` in this same directory — without
# it both files share the project `technotopia` and the volume `postgres_data`,
# so the dev database and the production one are the same disk.
name: technotopia-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host — only reachable by other services on this
    # network. The app connects to it as "postgres", not "localhost".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined into the bundle by `next build`, so the
        # canonical site URL has to be a build argument — setting it only in
        # env_file leaves the JSON-LD pointing at http://localhost:3000.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env.production}
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Admin image uploads are written to disk at runtime. The image bakes
      # `public/` in at build time, so without this mount every uploaded file
      # would be lost on the next `up -d --build`. The host directory must be
      # owned by the container's `nextjs` user (uid 1001) — see DEPLOYMENT.md.
      - ./uploads:/app/public/uploads
    # Not published to the host — nginx is the only public entry point.
    # docker-entrypoint.sh runs `prisma migrate deploy` before starting the
    # server, so migrations apply on every container start.

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # conf.d holds the HTTPS server block. It ships as https.conf.disabled
      # and is copied to https.conf once a certificate exists — nginx won't
      # start with an ssl_certificate that isn't there yet (DEPLOYMENT.md §5).
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app

volumes:
  postgres_data:
