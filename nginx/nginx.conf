user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  keepalive_timeout  65;

  # Don't advertise the nginx version on error pages or in the Server header.
  server_tokens off;

  # Admin image uploads are capped at 5MB by the upload route; nginx's 1MB
  # default would reject anything larger with a 413 before it got there.
  client_max_body_size 5m;

  gzip            on;
  gzip_vary       on;
  gzip_min_length 256;
  gzip_proxied    any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

  # Security headers. They live here, at the http level, so both the HTTP and
  # the HTTPS server block get them without the set being written twice.
  #
  # `add_header` does not merge across levels: a server or location block that
  # declares even one add_header of its own silently drops every header
  # inherited from above. So these must stay the only add_header directives in
  # this config — including in conf.d/*.conf.
  add_header X-Frame-Options        "SAMEORIGIN"                    always;
  add_header X-Content-Type-Options "nosniff"                       always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
  #
  # Strict-Transport-Security is deliberately not set here. Browsers cache it
  # for the whole max-age and there is no way to withdraw it early, so it is a
  # commitment to serve HTTPS for that long — worth making once the certificate
  # and its renewal have run for a while, not on the first deploy. Adding it
  # later means one more add_header line in this block, not in the server block.

  # Docker's embedded DNS server. The old `upstream app { server app:3000; }`
  # resolved once at config load and cached that address for the life of the
  # process, so a redeploy that landed the app container on a new IP left nginx
  # serving 502 until someone restarted it. A resolver plus a variable in
  # proxy_pass makes nginx look the name up again, at most `valid=` seconds
  # stale, and lets nginx start even while the app container is down.
  # ipv6=off: this compose network is IPv4-only, and without it every lookup
  # also waits on an AAAA answer that never comes back usefully.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Plain HTTP: serves the certbot ACME challenge, redirects everything else to
  # HTTPS. Replace your-domain.com with the real domain.
  server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # The HTTPS server block ships as conf.d/https.conf.disabled and is activated
  # by copying it to conf.d/https.conf once certbot has issued a certificate —
  # see DEPLOYMENT.md section 5. It can't be active before then: nginx refuses
  # to start when ssl_certificate points at a file that doesn't exist. Only
  # *.conf is included, so the .disabled file is ignored until it's copied.
  include /etc/nginx/conf.d/*.conf;
}
