name: CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: technotopia
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: technotopia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U technotopia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://technotopia:changeme@localhost:5432/technotopia?schema=public
      JWT_SECRET: ci-test-secret
      COOKIE_NAME: technotopia_session
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - name: Run unit + integration tests
        run: pnpm test
